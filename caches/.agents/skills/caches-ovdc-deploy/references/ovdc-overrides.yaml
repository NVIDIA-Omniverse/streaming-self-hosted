# OVDC overrides for mega-simulation. Enables shader bytecode caching
# and UJITSO derived data caching on write-render-worker via OVDC.
#
# OVDC endpoint assumes OVDC is deployed in the "ovdc" namespace (the
# default from caches-ovdc-deploy). If OVDC is in a different namespace,
# edit the endpoints below to match.
#
# Prefer merging these keys into the same Helm values file used for every
# simulation install and upgrade. If this file is used as a separate layer,
# pass it after OVCC proxy wiring on every helm upgrade; omitting it drops OVDC
# shader cache routing. The simulation-values placeholder below represents the
# operator's maintained values, including OVCC proxy wiring and other overrides.
# The command runs from this skill's root directory.
#
#   helm upgrade <release> <chart>                                       \
#     -f <simulation-values>.yaml                                        \
#     -f references/ovdc-overrides.yaml                                  \
#     --namespace <NAMESPACE> --wait --timeout 10m

srtx:
  write-render-worker:
    gxcache:
      enabled: false
      autoinject: false

    extraCmdArgs:
      - "--/drivercachewrapper/enableByProtocol=grpcdns://ovdc.ovdc.svc.cluster.local:3010"
      - --/drivercachewrapper/grpcDnsName=ovdc.ovdc.svc.cluster.local:3010
      - --/drivercachewrapper/grpcUseTLS=false
      - --/UJITSO/datastore/GRPCDataStore/useTLS=false
      - --/UJITSO/datastore/GRPCDataStore/selfFile/enabled=false
      - --/UJITSO/datastore/grpcDnsName=ovdc.ovdc.svc.cluster.local:3010

    kit:
      ujitso:
        datastore:
          grpcDnsName: "ovdc.ovdc.svc.cluster.local:3010"
        processors:
          textures: true
          geometry: true
          materials: true
