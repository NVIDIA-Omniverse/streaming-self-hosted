# DDCS overrides for mega-simulation. Enables shader bytecode caching
# and UJITSO derived data caching on write-render-worker via DDCS.
#
# DDCS endpoint assumes DDCS is deployed in the "ddcs" namespace (the
# default from caches-ddcs-deploy). If DDCS is in a different namespace,
# edit the endpoints below to match.
#
# Prefer merging these keys into the same Helm values file used for every
# simulation install and upgrade. If this file is used as a separate layer,
# pass it after UCC proxy wiring on every helm upgrade; omitting it drops DDCS
# shader cache routing.
#
#   helm upgrade <release> <chart>                                       \
#     -f values.yaml                                                     \
#     -f ucc-overrides.yaml                                              \
#     -f ddcs-overrides.yaml                                             \
#     --namespace <NAMESPACE> --wait --timeout 10m

srtx:
  write-render-worker:
    gxcache:
      enabled: false
      autoinject: false

    extraCmdArgs:
      - "--/drivercachewrapper/enableByProtocol=grpcdns://ddcs.ddcs.svc.cluster.local:3010"
      - --/drivercachewrapper/grpcDnsName=ddcs.ddcs.svc.cluster.local:3010
      - --/drivercachewrapper/grpcUseTLS=false
      - --/UJITSO/datastore/GRPCDataStore/useTLS=false
      - --/UJITSO/datastore/GRPCDataStore/selfFile/enabled=false
      - --/UJITSO/datastore/GRPCDnsName=ddcs.ddcs.svc.cluster.local:3010

    kit:
      ujitso:
        datastore:
          grpcDnsName: "ddcs.ddcs.svc.cluster.local:3010"
        processors:
          textures: true
          geometry: true
          materials: true
