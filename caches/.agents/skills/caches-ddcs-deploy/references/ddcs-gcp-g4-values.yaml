# DDCS Helm values for GKE g4 nodes. Overrides cloud-specific, security, and memory
# settings. Memory profile matches the 8 vCPU x 32GB RAM mode from the DDCS docs.
#
# Usage:
#   helm install ddcs nvidia-omniverse/ddcs --version 5.0.0 \
#     -f ddcs-gcp-g4-values.yaml \
#     --set cluster.container.storage.volume.storageClassName=hyperdisk-balanced \
#     --set "image.pullSecrets[0].name=ngc-docker-reg-secret" \
#     --namespace <NAMESPACE> --wait --timeout 5m
#
# Chart 5.0.0 pins image tag via appVersion -> nvcr.io/nvidia/omniverse/ddcs-dist-kv:5.0.0.
# Override only with --set image.tag=<x> --set image.overrideTag=true if you need a
# different image build.

# Overrides the default service name (<release>-<chart>) to just "ddcs". The mega-sim
# ddcs-overrides.yaml references ddcs:3010 for drivercachewrapper and UJITSO endpoints.
fullnameOverride: ddcs

# No CPU requests or limits. UCC and DDCS are bursty and non-competitive with GPU
# workloads. They should consume as much CPU as available during cache population bursts
# without being throttled by Kubernetes resource quotas.

cluster:
  # storageClassName depends on cloud provider and machine type. Passed via --set so the
  # file stays portable across clouds:
  #   GKE c4 / g4  -> hyperdisk-balanced
  #   GKE n2       -> pd-extreme-rwo or premium-rwo
  #   EKS          -> gp3
  #   AKS          -> managed-csi

  # Places DDCS on GPU nodes because they offer the network bandwidth needed
  # for cache serving. Select by stable GPU labels instead of a specific node
  # pool name so DDCS can spread across equivalent GPU pools in larger clusters.
  nodeSelector:
    cloud.google.com/gke-gpu: "true"

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  # Two DDCS pods must never share the same node (hard). DDCS and UCC should prefer
  # different nodes to avoid competing for resources, but co-location is acceptable
  # when node count is limited (soft).
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ddcs
          topologyKey: kubernetes.io/hostname
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - usd-content-cache
            topologyKey: kubernetes.io/hostname

  container:
    resources:
      requests:
        memory: 32Gi

    storage:
      volume:
        # Defaults to 2TiB because most disk types (gp3, pd-ssd, premium-rwo) scale IOPS
        # and throughput with disk size. Only GKE hyperdisk-balanced provisions performance
        # independently of size, so it can use a smaller disk (e.g. 300Gi) without
        # sacrificing I/O performance.
        size: 2048Gi

    settings:
      engine:
        sys.cache_size: "10G"
        sys.block_cache_size: "18G"
        cf.max_write_buffer_number: 128
        sys.increase_parallelism: 8
        db.max_background_jobs: 8

      grpc:
        tls:
          enabled: false
        jwt:
          enabled: false

# Disables Prometheus Operator CRDs (ServiceMonitor, PrometheusRule) which are not
# installed on GKE by default. GKE Managed Prometheus uses PodMonitoring instead;
# apply the PodMonitoring manifest separately after install.
monitoring:
  enabled: false
  prometheusAlerts: false
