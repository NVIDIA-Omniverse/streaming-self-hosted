# DDCS memory profile: 12 vCPU x 64GB RAM
# Source: https://docs.omniverse.nvidia.com/ovcaches/ddcs/latest/configure.html#memory-configuration
#
# Merge with a platform values file when the DDCS node has 64GB RAM:
#   helm install ddcs ... -f ddcs-gcp-g4-values.yaml -f ddcs-memory-64gb.yaml
#
# The chart default (cf.max_write_buffer_number: 8) is too small for write-heavy
# workloads and can cause "multi part value is not complete" write failures.

cluster:
  container:
    resources:
      requests:
        memory: 64Gi

    settings:
      engine:
        sys.cache_size: "20G"
        sys.block_cache_size: "36G"
        cf.max_write_buffer_number: 128
        sys.increase_parallelism: 12
        db.max_background_jobs: 12
