# DDCS memory profile: 8 vCPU x 32GB RAM
# Source: https://docs.omniverse.nvidia.com/ovcaches/ddcs/latest/configure.html#memory-configuration
#
# This is the recommended default for most deployments. The bundled G4 reference
# values files already include these settings. Use this file when layering memory
# overrides onto a platform values file that does not set engine cache sizes:
#   helm install ddcs ... -f ddcs-gcp-g4-values.yaml -f ddcs-memory-32gb.yaml
#
# The chart default (cf.max_write_buffer_number: 8) is too small for write-heavy
# workloads and can cause "multi part value is not complete" write failures.

cluster:
  container:
    resources:
      requests:
        memory: 32Gi

    settings:
      engine:
        sys.cache_size: "10G"
        sys.block_cache_size: "18G"
        cf.max_write_buffer_number: 128
        sys.increase_parallelism: 8
        db.max_background_jobs: 8
