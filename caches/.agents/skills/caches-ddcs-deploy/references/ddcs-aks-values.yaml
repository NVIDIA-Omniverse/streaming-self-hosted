# DDCS Helm values for AKS (NVCF / streaming context). Mirrors ddcs-gcp-g4-values.yaml with
# Azure deltas. Confirmed with ddcs 5.0.0 on the NVCF-on-AKS bring-up (rc.63 / rc.70).
#
# Usage:
#   helm install ddcs nvidia-omniverse/ddcs --version 5.0.0 \
#     -f references/ddcs-aks-values.yaml \
#     --set "image.pullSecrets[0].name=nvcr-creds" \
#     --namespace <NAMESPACE> --wait --timeout 5m
#
# Chart 5.0.0 pins image tag via appVersion -> nvcr.io/nvidia/omniverse/ddcs-dist-kv:5.0.0.
# Override only with --set image.tag=<x> --set image.overrideTag=true for a different build.
#
# Azure deltas vs the GKE reference (ddcs-gcp-g4-values.yaml):
#   - node placement: the AKS CPU compute pool (node-type=compute), NOT GPU nodes. No GPU
#     label selector and no nvidia.com/gpu toleration — the GPU pool is untainted (label-only
#     reservation) and DDCS does not consume GPU resources.
#   - storageClassName: managed-csi-premium-burst = Azure Premium SSD with on-demand bursting,
#     set in-file (the value is AKS-specific; the GKE file passes it via --set to stay portable).
#     Production-ready: meets SKILL.md's >=4000 IOPS target — 2 TiB clears the >512 GiB threshold
#     for on-demand burst (up to ~30,000 IOPS, unlimited duration). Do NOT use managed-csi
#     (Standard SSD) for sustained load: flat ~500 baseline IOPS, credit-based burst only (~30 min);
#     IOPS do NOT scale with size on Standard SSD.
#   - cache volume size: 2048Gi (2 TiB), matching the GKE reference. Thin-provisioned — unused
#     capacity is not billed/consumed until written. Quick smoke-test only: managed-csi + 50Gi.
#   - memory request: 16Gi. The chart default (~56Gi) does not fit typical AKS node SKUs and
#     leaves the pod Pending; 16Gi was sufficient for the tested workload.
#   - pull secret name convention: nvcr-creds.

# Overrides the default service name (<release>-<chart>) to just "ddcs". The mega-sim
# ddcs-overrides.yaml references ddcs:3010 for drivercachewrapper and UJITSO endpoints.
fullnameOverride: ddcs

cluster:
  replicas: 1

  # AKS CPU compute pool; the pool is untainted (label-only reservation) so no toleration needed.
  nodeSelector:
    node-type: compute

  # Two DDCS pods must never share the same node (hard); prefer a different node from UCC
  # (soft). Inert at replicas: 1; matters once scaled.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ddcs
          topologyKey: kubernetes.io/hostname
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - usd-content-cache
            topologyKey: kubernetes.io/hostname

  container:
    storage:
      volume:
        # PRODUCTION DEFAULT: managed-csi-premium-burst at 2 TiB meets SKILL.md's >=4000 IOPS
        # target (>512 GiB unlocks on-demand burst, up to ~30,000 IOPS / unlimited duration);
        # 2 TiB is thin-provisioned, so unused space is free. managed-csi (Standard SSD) is a flat
        # ~500 IOPS regardless of size and cannot sustain production load.
        # QUICK SMOKE-TEST ONLY (confirm the service comes up — never for real load): you may set
        # storageClassName: managed-csi with size: 50Gi.
        storageClassName: managed-csi-premium-burst
        size: 2048Gi

    settings:
      grpc:
        tls:
          enabled: false
        jwt:
          enabled: false

    # Chart default memory request (~56Gi) is too large for typical AKS node SKUs and leaves
    # the pod Pending. 16Gi was sufficient for the tested workload.
    resources:
      requests:
        memory: 16Gi

# Disables Prometheus Operator CRDs (ServiceMonitor, PrometheusRule), not installed on this
# AKS cluster.
monitoring:
  enabled: false
  prometheusAlerts: false
