# CVE waivers for the vulnerability gate, shared by every scanner:
# scripts/ecr_scanner.py, scripts/trivy_scanner.py, scripts/acr_scanner.py, and
# the consolidated report.
# Scanned images come from manifest.yaml (non-helm-* container pins + helm-* OCI chart pins)
# plus upstream artifacts-*.txt when receive ran. Waivers apply to findings after mirror + scan.
# `image:` is matched on the repository (image name without registry/prefix), so one entry
# covers the same image across ECR, Trivy, and ACR/Defender.
# TODO(temp-hatch): 30 placeholder waivers added 2026-05-08 to unblock promotion-flow
# testing.  All expire 2026-08-31.  Need real triage with image owners before then.
# See project_kasonsm_promotion_workarounds.md item #3.
# Note: AWS Inspector v2 enrichment and Microsoft Defender scan-on-push are both
# async; waiver list is a superset of findings observed across multiple runs to
# stay stable across re-scans.
