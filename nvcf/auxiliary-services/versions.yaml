version: 1

skills:
  nvcf-lls-install:
    chart:
      name: gdn-streaming
      registry: https://helm.ngc.nvidia.com/nvidia/omniverse/charts/gdn-streaming-3.0.0.tgz
      version: 3.0.0
    images:
      streaming-proxy:
        source: nvcr.io/nvidia/omniverse/streaming-proxy
        tag: 4.0.2
        provider_validation_wrapper_tag: 4.0.2
      turn:
        source: nvcr.io/nvidia/omniverse/turn
        tag: 4.0.2
      nvcf-openbao:
        source: nvcr.io/nvidia/nvcf/nvcf-openbao
        tag: 2.6.2-nv-1.3.4
    ports:
      # Internal streaming-proxy listener / Service targetPort. This is not the
      # advertised client port; see providers/kubernetes.md for resolving it.
      udp_media: 5004
      tcp_turn: 3478
      tcp_turn_tls: 5349
      tcp_turn_health: 8080
      # Chart media Service nodePort. Advertise it only for direct NodePort
      # access; LoadBalancer/NAT paths advertise their external listener.
      chart_node_port: 30504
      sibling_lb_node_port: 30505
      health_metrics: 8000
    sync:
      ref: lls/v4.0.0-rc.6
      upstream_sha: 342c3b2dbb2304a10ca1bd332226eee45fc30671

  nvcf-gxcache:
    chart:
      name: helm-gxcache
      registry: oci://nvcr.io/0833294136851237/nvcf-ncp-staging/helm-gxcache
      version: 0.8.2
    images:
      gxcache-service:
        source: nvcr.io/0833294136851237/nvcf-ncp-staging/gxcache-service
        tag: b206ce39
      gxcache-webhook:
        source: nvcr.io/0833294136851237/nvcf-ncp-staging/gxcache-webhook
        tag: 59bd8ec5
      gxcache-init:
        source: nvcr.io/0833294136851237/nvcf-ncp-staging/gxcache-init
        tag: 1e47f722
    sync:
      ref: gxcache/v0.8.2-rc.5
      upstream_sha: 89a1ab713aaf871dac315bea76120052197fe191

notes:
  - Each skill entry is composed from its own upstream ref so LLS and GXCache can advance independently.
  - Provider paths may mirror these charts/images to another registry.
  - Keep version bumps explicit and reviewed; downstream repos should update their lock files after syncing.
